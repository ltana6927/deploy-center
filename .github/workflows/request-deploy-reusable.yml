name: Reusable Request Deploy

on:
  workflow_call:
    inputs:
      source_sha:
        description: Full SHA produced by the trusted Docker build
        required: true
        type: string
      source_run_id:
        description: GitHub Actions run ID of the trusted Docker build
        required: true
        type: string
    secrets:
      DEPLOY_CENTER_TOKEN:
        description: Fine-grained PAT scoped only to ltana6927/deploy-center
        required: true

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Validate and request deployment
        env:
          DEPLOY_CENTER_TOKEN: ${{ secrets.DEPLOY_CENTER_TOKEN }}
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail

          case "${SOURCE_REPO}" in
            ltana6927/*) ;;
            *) printf '%s\n' 'Untrusted source repository' >&2; exit 1 ;;
          esac
          case "${SOURCE_SHA}" in
            *[!0-9a-f]*|'') printf '%s\n' 'source_sha must be lowercase hexadecimal' >&2; exit 1 ;;
          esac
          if [ "${#SOURCE_SHA}" -ne 40 ]; then
            printf '%s\n' 'source_sha must be a full 40-character SHA' >&2
            exit 1
          fi
          case "${SOURCE_RUN_ID}" in
            *[!0-9]*|'') printf '%s\n' 'source_run_id must be numeric' >&2; exit 1 ;;
          esac

          jq -n \
            --arg repo "${SOURCE_REPO}" \
            --arg sha "${SOURCE_SHA}" \
            --arg run_id "${SOURCE_RUN_ID}" \
            '{event_type:"deploy-service",client_payload:{source_repo:$repo,source_sha:$sha,source_run_id:$run_id}}' \
          | curl --proto '=https' --fail --silent --show-error \
              --request POST \
              --header 'Accept: application/vnd.github+json' \
              --header "Authorization: Bearer ${DEPLOY_CENTER_TOKEN}" \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              --data-binary @- \
              https://api.github.com/repos/ltana6927/deploy-center/dispatches
