name: Deploy Service

on:
  repository_dispatch:
    types: [deploy-service, verify-image-archive]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event.client_payload.source_repo }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      build_conclusion: ${{ steps.policy.outputs.build_conclusion }}
      display_name: ${{ steps.policy.outputs.display_name }}
      healthcheck_url: ${{ steps.policy.outputs.healthcheck_url }}
      image_ref: ${{ steps.policy.outputs.image_ref }}
      image_archive_id: ${{ steps.policy.outputs.image_archive_id }}
      image_archive_digest: ${{ steps.policy.outputs.image_archive_digest }}
      image_archive_size: ${{ steps.policy.outputs.image_archive_size }}
      service_prefix: ${{ steps.policy.outputs.service_prefix }}
      source_repo: ${{ steps.policy.outputs.source_repo }}
      source_run_url: ${{ steps.policy.outputs.source_run_url }}
      source_sha: ${{ steps.policy.outputs.source_sha }}
      swarm_service: ${{ steps.policy.outputs.swarm_service }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - id: policy
        name: Validate source build and deployment policy
        env:
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          TRUSTED_OWNER: ltana6927
          EXPECTED_SERVER: monadao-prod
          PRODUCTION_BRANCH: main
          TRUSTED_WORKFLOW_PATH: .github/workflows/docker-build.yml
          DEPLOY_CONFIG_PATH: .github/deploy.yml
        run: node scripts/validate-request.mjs

  deploy:
    needs: validate
    if: needs.validate.outputs.build_conclusion == 'success'
    runs-on: [self-hosted, Linux, monadao-prod, swarm]
    # Registry download or resumable archive recovery plus rollout and health.
    timeout-minutes: 65
    concurrency:
      group: deploy-monadao-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Validate deployment inputs on the server
        env:
          IMAGE_REF: ${{ needs.validate.outputs.image_ref }}
          SERVICE_PREFIX: ${{ needs.validate.outputs.service_prefix }}
          SOURCE_REPO: ${{ needs.validate.outputs.source_repo }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          SWARM_SERVICE: ${{ needs.validate.outputs.swarm_service }}
        run: |
          set -euo pipefail
          case "${SOURCE_REPO}" in
            ltana6927/*) ;;
            *) echo "Untrusted repository" >&2; exit 1 ;;
          esac
          case "${IMAGE_REF}" in
            "ghcr.io/${SOURCE_REPO}/"*:"${SOURCE_SHA}") ;;
            *) echo "Image reference is outside the repository namespace" >&2; exit 1 ;;
          esac
          case "${SWARM_SERVICE}" in
            "${SERVICE_PREFIX}"|"${SERVICE_PREFIX}"-*) ;;
            *) echo "Swarm service is outside the repository namespace" >&2; exit 1 ;;
          esac
          docker service inspect "${SWARM_SERVICE}" >/dev/null

      - id: image
        name: Pull and verify immutable image
        timeout-minutes: 45
        env:
          IMAGE_REF: ${{ needs.validate.outputs.image_ref }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          SWARM_SERVICE: ${{ needs.validate.outputs.swarm_service }}
          SOURCE_REPO: ${{ needs.validate.outputs.source_repo }}
          IMAGE_ARCHIVE_ID: ${{ needs.validate.outputs.image_archive_id }}
          IMAGE_ARCHIVE_DIGEST: ${{ needs.validate.outputs.image_archive_digest }}
          IMAGE_ARCHIVE_SIZE: ${{ needs.validate.outputs.image_archive_size }}
          SOURCE_READ_TOKEN: ${{ secrets.SOURCE_READ_TOKEN }}
          IMAGE_RECOVERY_ONLY: ${{ github.event.action == 'verify-image-archive' && 'true' || 'false' }}
        run: |
          set -euo pipefail
          IMAGE_PULLED=false
          PULL_ATTEMPTS=2
          PULL_TIMEOUT=20m
          if [ -n "${IMAGE_ARCHIVE_ID}" ]; then
            PULL_ATTEMPTS=1
            PULL_TIMEOUT=3m
          fi
          if [ "${IMAGE_RECOVERY_ONLY}" = true ]; then
            if [ -z "${IMAGE_ARCHIVE_ID}" ]; then
              printf '%s\n' 'This successful build has no archive to verify.' >&2
              exit 1
            fi
            PULL_ATTEMPTS=0
          fi
          for ((attempt=1; attempt<=PULL_ATTEMPTS; attempt++)); do
            printf 'Pulling verified image (attempt %s/%s)\n' "${attempt}" "${PULL_ATTEMPTS}"
            if timeout --signal=TERM --kill-after=30s "${PULL_TIMEOUT}" docker pull "${IMAGE_REF}"; then
              IMAGE_PULLED=true
              break
            else
              PULL_STATUS=$?
              printf 'Image pull failed with exit code %s\n' "${PULL_STATUS}" >&2
            fi
            if [ "${attempt}" -lt "${PULL_ATTEMPTS}" ]; then
              sleep 15
            fi
          done
          ARCHIVE_IMAGE_DIGEST=""
          if [ "${IMAGE_PULLED}" != true ] && [ -n "${IMAGE_ARCHIVE_ID}" ]; then
            umask 077
            ARCHIVE_DIR="$(mktemp -d "${RUNNER_TEMP}/production-image.XXXXXX")"
            trap 'rm -rf -- "${ARCHIVE_DIR}"' EXIT
            export ARCHIVE_DIR
            printf '%s\n' 'Recovering the verified build archive with eight resumable ranges'
            python3 "${GITHUB_WORKSPACE}/scripts/download-archive.py"
            ARCHIVE_INFO="$(python3 - <<'PY'
          import hashlib, json, os, pathlib, re, stat, zipfile
          directory = pathlib.Path(os.environ['ARCHIVE_DIR'])
          def checksum(path):
              digest = hashlib.sha256()
              with path.open('rb') as stream:
                  for block in iter(lambda: stream.read(1024 * 1024), b''):
                      digest.update(block)
              return digest.hexdigest()
          if 'sha256:' + checksum(directory / 'image.zip') != os.environ['IMAGE_ARCHIVE_DIGEST']:
              raise ValueError('Build artifact checksum mismatch')
          allowed = {'main-image.tar.gz': 2 ** 30, 'main-image.tar.gz.sha256': 128, 'image.json': 4096}
          with zipfile.ZipFile(directory / 'image.zip') as archive:
              entries = archive.infolist()
              if len(entries) != len(allowed) or {entry.filename for entry in entries} != set(allowed):
                  raise ValueError('Unexpected archive files')
              for entry in entries:
                  if entry.file_size > allowed[entry.filename] or stat.S_ISLNK(entry.external_attr >> 16):
                      raise ValueError('Unsafe archive entry')
              archive.extractall(directory)
          metadata = json.loads((directory / 'image.json').read_text())
          image_ref = os.environ['IMAGE_REF']
          repository = image_ref.rsplit(':', 1)[0]
          if set(metadata) != {'image_ref', 'image_digest', 'image_id', 'revision'} or metadata['image_ref'] != image_ref or metadata['revision'] != os.environ['SOURCE_SHA']:
              raise ValueError('Archive belongs to a different image or revision')
          if not re.fullmatch(re.escape(repository) + r'@sha256:[a-f0-9]{64}', metadata['image_digest']) or not re.fullmatch(r'sha256:[a-f0-9]{64}', metadata['image_id']):
              raise ValueError('Invalid image digest or ID')
          receipt = (directory / 'main-image.tar.gz.sha256').read_text().split()
          if receipt != [checksum(directory / 'main-image.tar.gz'), 'main-image.tar.gz']:
              raise ValueError('Exported image checksum mismatch')
          print(metadata['image_digest'], metadata['image_id'])
          PY
            )"
            read -r ARCHIVE_IMAGE_DIGEST ARCHIVE_IMAGE_ID <<< "${ARCHIVE_INFO}"
            docker load --input "${ARCHIVE_DIR}/main-image.tar.gz"
            LOADED_IMAGE_ID="$(docker image inspect --format '{{ .Id }}' "${IMAGE_REF}")"
            if [ "${LOADED_IMAGE_ID}" != "${ARCHIVE_IMAGE_ID}" ]; then
              printf '%s\n' 'Loaded image ID differs from the verified archive.' >&2
              exit 1
            fi
            # Resolve registry metadata after loading; large layers are cached.
            timeout --signal=TERM --kill-after=30s 3m docker pull "${IMAGE_REF}"
            IMAGE_PULLED=true
          fi
          if [ "${IMAGE_PULLED}" != true ]; then
            printf '%s\n' 'Image pull failed after two attempts; the running service was not changed.' >&2
            exit 1
          fi

          read -r IMAGE_REVISION < <(
            docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "${IMAGE_REF}"
          )
          if [ "${IMAGE_REVISION}" != "${SOURCE_SHA}" ]; then
            printf '%s\n' 'Image revision label does not match the verified source SHA' >&2
            exit 1
          fi

          IMAGE_REPOSITORY="${IMAGE_REF%:*}"
          read -r IMAGE_DIGEST < <(
            docker image inspect --format '{{ index .RepoDigests 0 }}' "${IMAGE_REF}"
          )
          case "${IMAGE_DIGEST}" in
            "${IMAGE_REPOSITORY}"@sha256:*) ;;
            *) printf '%s\n' 'Pulled image has an unexpected repository digest' >&2; exit 1 ;;
          esac
          DIGEST_HEX="${IMAGE_DIGEST#*@sha256:}"
          case "${DIGEST_HEX}" in
            *[!0-9a-f]*|'') printf '%s\n' 'Image digest is not lowercase hexadecimal' >&2; exit 1 ;;
          esac
          if [ "${#DIGEST_HEX}" -ne 64 ]; then
            printf '%s\n' 'Image digest must contain 64 hexadecimal characters' >&2
            exit 1
          fi
          if [ -n "${ARCHIVE_IMAGE_DIGEST}" ] && [ "${IMAGE_DIGEST}" != "${ARCHIVE_IMAGE_DIGEST}" ]; then
            printf '%s\n' 'Registry digest differs from the verified build archive.' >&2
            exit 1
          fi
          printf 'image_digest=%s\n' "${IMAGE_DIGEST}" >> "${GITHUB_OUTPUT}"

          read -r CURRENT_IMAGE < <(
            docker service inspect \
              --format '{{ .Spec.TaskTemplate.ContainerSpec.Image }}' \
              "${SWARM_SERVICE}"
          )
          if [ "${CURRENT_IMAGE}" = "${IMAGE_DIGEST}" ]; then
            printf 'already_deployed=true\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'already_deployed=false\n' >> "${GITHUB_OUTPUT}"
          fi

      - name: Update Swarm service
        if: steps.image.outputs.already_deployed != 'true' && github.event.action != 'verify-image-archive'
        timeout-minutes: 8
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.image_digest }}
          SWARM_SERVICE: ${{ needs.validate.outputs.swarm_service }}
        run: |
          set -euo pipefail
          docker service update \
            --with-registry-auth \
            --update-order start-first \
            --update-parallelism 1 \
            --update-failure-action rollback \
            --image "${IMAGE_DIGEST}" \
            --force \
            --detach=false \
            "${SWARM_SERVICE}"

      - name: Verify public health endpoint
        timeout-minutes: 8
        env:
          HEALTHCHECK_URL: ${{ needs.validate.outputs.healthcheck_url }}
          SWARM_SERVICE: ${{ needs.validate.outputs.swarm_service }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --proto '=https' --max-time 10 --fail --silent --show-error "${HEALTHCHECK_URL}" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker service ps "${SWARM_SERVICE}" --no-trunc || true
          printf '%s\n' 'Health check failed; inspect application logs in the private server logging system.' >&2
          exit 1

  notify:
    needs: [validate, deploy]
    if: always() && github.event.action == 'deploy-service'
    runs-on: ubuntu-latest
    steps:
      - name: Send Feishu result
        env:
          BUILD_STATUS: ${{ needs.validate.outputs.build_conclusion }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          DISPLAY_NAME: ${{ needs.validate.outputs.display_name || github.event.client_payload.source_repo }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          SOURCE_REPO: ${{ needs.validate.outputs.source_repo || github.event.client_payload.source_repo }}
          SOURCE_RUN_URL: ${{ needs.validate.outputs.source_run_url }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha || github.event.client_payload.source_sha }}
          VALIDATE_STATUS: ${{ needs.validate.result }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "${FEISHU_WEBHOOK}" ]; then
            echo "FEISHU_WEBHOOK is not configured"
            exit 0
          fi

          if [ "${VALIDATE_STATUS}" != "success" ]; then
            RESULT="Rejected"
            COLOR="red"
          elif [ "${BUILD_STATUS}" != "success" ]; then
            RESULT="Build failed"
            COLOR="red"
          elif [ "${DEPLOY_STATUS}" = "success" ]; then
            RESULT="Deployment succeeded"
            COLOR="green"
          else
            RESULT="Deployment failed"
            COLOR="red"
          fi

          PAYLOAD=$(jq -n \
            --arg color "${COLOR}" \
            --arg title "${DISPLAY_NAME}: ${RESULT}" \
            --arg repo "${SOURCE_REPO}" \
            --arg sha "${SOURCE_SHA}" \
            --arg build "${BUILD_STATUS:-unknown}" \
            --arg deploy "${DEPLOY_STATUS:-unknown}" \
            --arg source_url "${SOURCE_RUN_URL}" \
            --arg deploy_url "${DEPLOY_RUN_URL}" \
            '{msg_type:"interactive",card:{header:{template:$color,title:{tag:"plain_text",content:$title}},elements:[{tag:"div",text:{tag:"lark_md",content:("**Repository:** " + $repo + "\n**Commit:** " + $sha + "\n**Build:** " + $build + "\n**Deploy:** " + $deploy)}},{tag:"action",actions:[{tag:"button",text:{tag:"plain_text",content:"Build logs"},url:$source_url,type:"default"},{tag:"button",text:{tag:"plain_text",content:"Deploy logs"},url:$deploy_url,type:"primary"}]}]}}')

          curl --fail --silent --show-error \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "${PAYLOAD}" \
            "${FEISHU_WEBHOOK}"
